app = "prumo-backend"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  PORT = "8085"

[http_service]
  internal_port = 8085
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
