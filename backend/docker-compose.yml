services:
  postgres:
    image: postgres:18-alpine
    container_name: prumo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prumo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prumo}
      POSTGRES_DB: ${POSTGRES_DB:-prumo}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5434:5432"
    volumes:
      - prumo_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prumo -d prumo"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: prumo-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - prumo_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  prumo_pgdata:
    name: prumo_pgdata
  prumo_redisdata:
    name: prumo_redisdata
